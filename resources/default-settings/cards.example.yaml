      plugin: ctrl
      method: mute
      kwargs: {}
      ignore_card_removal_action: true
'7':
      package: volume
      plugin: ctrl
      method: get_volume
'8':
      package: volume
      plugin: ctrl
      method: set_volume
      args: [18]
'7896':
      package: volume
      plugin: ctrl
      method: set_volume
      args:
          - 12
          - 'erasdf'
      kwargs:
          aparam: 23
          bparam: 'sdfs'
          cparam: 56
'T':
      package: player
      plugin: ctrl
      method: play_card
      args: [path/to/music/folder]
'G':
      alias: play_card
      args: path/to/music/folder
'V+':
      alias: change_volume
      args: 3
      ignore_card_removal_action: true
'V-':
      alias: change_volume
      args: -3
      ignore_card_removal_action: true
