# https://docs.pytest.org/en/6.2.x/reference.html#confval-testpaths

[pytest]
addopts = --maxfail=2 -rf --ff -v --import-mode=importlib
testpaths = test
markers =
    e2e_spotify: end-to-end tests against the real Spotify Web API; skipped unless SPOTIFY_E2E_* credentials are set (see documentation/developers/spotify-integration.md)
