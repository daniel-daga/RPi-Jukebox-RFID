name: Test Spotify Feature

# Fast, deterministic Spotify feature tests on a plain runner:
# no Raspberry Pi, no QEMU, no Spotify credentials, no external
# package sources (mopidy comes from the distro archive).
# See tests/spotify/README.md for details.

# Automatic triggers disabled on purpose: this workflow now only runs when
# started manually (Actions tab -> Run workflow). The original triggers are
# kept commented out below so they can be restored by un-commenting them
# and removing the workflow_dispatch block.
on:
  workflow_dispatch:

#on:
#  push:
#    branches-ignore:
#        - 'future3/**'
#  pull_request:
#    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install mopidy mopidy-mpd mpc gstreamer1.0-plugins-good php-cli python3-pytest

    - name: Run Spotify feature tests
      run: ./tests/spotify/run_tests.sh
