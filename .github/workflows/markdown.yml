name: Markdown Linting

# Automatic triggers disabled on purpose: this workflow now only runs when
# started manually (Actions tab -> Run workflow). The original triggers are
# kept commented out below so they can be restored by un-commenting them
# and removing the workflow_dispatch block.
on:
  workflow_dispatch:

#on:
#  push:
#    branches-ignore:
#        - 'future3/**'
#    paths:
#        - '**.md'
#  pull_request:
#    branches:
#        - develop
#        - master
#    paths:
#        - '**.md'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Linting markdown
      uses: DavidAnson/markdownlint-cli2-action@v22
      with:
        config: .markdownlint-cli2.yaml
      #continue-on-error: true
